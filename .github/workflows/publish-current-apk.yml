name: Publish verified TowerRadar v0.27.4 APK
on:
  workflow_run:
    workflows: ["Build Android APK"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - name: Select only latest successfully verified main-branch APK
        id: selection
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ -z "$SOURCE_RUN" ]]; then
            SOURCE_RUN="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/android.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id')"
            SOURCE_SHA="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq '.head_sha')"
          fi
          HEAD="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          if [[ "$SOURCE_SHA" != "$HEAD" ]]; then
            echo "Skipping stale build $SOURCE_RUN; HEAD is $HEAD"
            exit 0
          fi
          echo "publish=yes" >> "$GITHUB_OUTPUT"
          echo "run_id=$SOURCE_RUN" >> "$GITHUB_OUTPUT"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Download and validate signed APK from CI
        if: steps.selection.outputs.publish == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.selection.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p extracted checks
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name TowerRadar-signed-APK --dir extracted
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name TowerRadar-signature --dir checks
          test -s extracted/towerradar-signed.apk
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' checks/signature.txt
          cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' checks/signature.txt | head -n 1 | tr '[:upper:]' '[:lower:]')"
          saved_cert="$(cat checks/certificate-sha256.txt)"
          test -n "$cert" && test "$cert" = "$saved_cert"
          expected="$(awk '{print $1}' checks/sha256.txt)"
          actual="$(sha256sum extracted/towerradar-signed.apk | awk '{print $1}')"
          test "$expected" = "$actual"
          # Publishing must never retag an APK built with an outdated version code.
          test "$(grep -m1 'versionCode = ' app/build.gradle.kts | awk '{print $3}')" = "31"
          test "$(grep -m1 'versionName = ' app/build.gradle.kts | cut -d '"' -f 2)" = "0.27.4"
          cp extracted/towerradar-signed.apk TowerRadar-v0.27.4.apk
          echo "APK SHA-256: $actual" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish direct GitHub Release APK download
        if: steps.selection.outputs.publish == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.selection.outputs.sha }}
        run: |
          set -euo pipefail
          if gh release view v0.27.4 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit v0.27.4 --prerelease --repo "$GITHUB_REPOSITORY"
            gh release upload v0.27.4 TowerRadar-v0.27.4.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v0.27.4 TowerRadar-v0.27.4.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" \
              --title "TowerRadar v0.27.4 — выбор области на любой карте и кеш 500 МБ/без ограничений" \
              --notes "TowerRadar 0.27.4: меню кеша теперь содержит только 500 МБ, Без ограничений и очистку; старые лимиты 100 и 250 МБ автоматически заменяются на 500 МБ. На любой выбранной карте можно выделить область вручную или радиусом 10/30 км, не меняя подложку. Для источников без массовой офлайн-загрузки сохраняются только границы района, а не тайлы; временный кеш Яндекс Tiles API формируется при обычном просмотре. OpenFreeMap по-прежнему поддерживает предварительную загрузку офлайн-пакетов." \
              --prerelease
          fi
          echo "Direct APK: https://github.com/$GITHUB_REPOSITORY/releases/download/v0.27.4/TowerRadar-v0.27.4.apk" >> "$GITHUB_STEP_SUMMARY"
