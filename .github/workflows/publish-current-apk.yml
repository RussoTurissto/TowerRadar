name: Publish verified TowerRadar v0.10.0 APK
on:
  workflow_run:
    workflows: ["Build Android APK"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - name: Select only latest successfully verified main-branch APK
        id: selection
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ -z "$SOURCE_RUN" ]]; then
            SOURCE_RUN="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/android.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id')"
            SOURCE_SHA="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq '.head_sha')"
          fi
          HEAD="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          if [[ "$SOURCE_SHA" != "$HEAD" ]]; then
            echo "Skipping stale build $SOURCE_RUN; HEAD is $HEAD"
            exit 0
          fi
          echo "publish=yes" >> "$GITHUB_OUTPUT"
          echo "run_id=$SOURCE_RUN" >> "$GITHUB_OUTPUT"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Download and validate signed APK from CI
        if: steps.selection.outputs.publish == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.selection.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p extracted checks
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name TowerRadar-signed-APK --dir extracted
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name TowerRadar-signature --dir checks
          test -s extracted/towerradar-signed.apk
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' checks/signature.txt
          cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' checks/signature.txt | head -n 1 | tr '[:upper:]' '[:lower:]')"
          saved_cert="$(cat checks/certificate-sha256.txt)"
          test -n "$cert" && test "$cert" = "$saved_cert"
          expected="$(awk '{print $1}' checks/sha256.txt)"
          actual="$(sha256sum extracted/towerradar-signed.apk | awk '{print $1}')"
          test "$expected" = "$actual"
          cp extracted/towerradar-signed.apk TowerRadar-v0.10.0.apk
          echo "APK SHA-256: $actual" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish direct GitHub Release APK download
        if: steps.selection.outputs.publish == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.selection.outputs.sha }}
        run: |
          set -euo pipefail
          if gh release view v0.10.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit v0.10.0 --prerelease --repo "$GITHUB_REPOSITORY"
            gh release upload v0.10.0 TowerRadar-v0.10.0.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v0.10.0 TowerRadar-v0.10.0.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" \
              --title "TowerRadar v0.10.0 — постоянная подпись, радиосигнал и соседние соты" \
              --notes "Предварительная версия TowerRadar 0.10.0. APK подписан постоянным RSA4096 ключом TowerRadar из GitHub Secrets, APK v2 и сертификат SHA-256 проверены в CI. Мониторинг оператора/мощности и пяти делений работает отдельно от GPS при наличии данных модема. Сканер соседних сот, PCI, радиоканалы EARFCN/NRARFCN, диапазоны B/n, Timing Advance, точный поиск отдельных сот через OpenCellID и официальные реестры в браузере. Координаты OpenCellID — оценка, OSM-маркеры не считаются доказательством подключения. ВАЖНО: из-за смены с debug-подписи на постоянную первый переход может потребовать переустановку, прежде сохрани API-ключи и настройки. Эта версия Pre-release, стабильная 1.0.0 только с отдельного разрешения пользователя." \
              --prerelease
          fi
          echo "Direct APK: https://github.com/$GITHUB_REPOSITORY/releases/download/v0.10.0/TowerRadar-v0.10.0.apk" >> "$GITHUB_STEP_SUMMARY"
