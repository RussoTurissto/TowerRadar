name: Publish verified TowerRadar v0.9.0 APK
on:
  workflow_run:
    workflows: ["Build Android APK"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - name: Select only latest successfully verified main-branch APK
        id: selection
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ -z "$SOURCE_RUN" ]]; then
            SOURCE_RUN="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/android.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id')"
            SOURCE_SHA="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq '.head_sha')"
          fi
          HEAD="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          if [[ "$SOURCE_SHA" != "$HEAD" ]]; then
            echo "Skipping stale build $SOURCE_RUN; HEAD is $HEAD"
            exit 0
          fi
          echo "publish=yes" >> "$GITHUB_OUTPUT"
          echo "run_id=$SOURCE_RUN" >> "$GITHUB_OUTPUT"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Download and validate signed APK from CI
        if: steps.selection.outputs.publish == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.selection.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p extracted checks
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name TowerRadar-debug-APK --dir extracted
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name TowerRadar-signature --dir checks
          test -s extracted/app-debug.apk
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' checks/signature.txt
          expected="$(awk '{print $1}' checks/sha256.txt)"
          actual="$(sha256sum extracted/app-debug.apk | awk '{print $1}')"
          test "$expected" = "$actual"
          cp extracted/app-debug.apk TowerRadar-v0.9.0-debug.apk
          echo "APK SHA-256: $actual" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish direct GitHub Release APK download
        if: steps.selection.outputs.publish == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.selection.outputs.sha }}
        run: |
          set -euo pipefail
          if gh release view v0.9.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v0.9.0 TowerRadar-v0.9.0-debug.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v0.9.0 TowerRadar-v0.9.0-debug.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" \
              --title "TowerRadar v0.9.0 — умное сворачивание панели и статус Яндекс Карт" \
              --notes "Предварительная сборка TowerRadar 0.9.0. Касание карты за пределами раскрытой панели сворачивает её в компактный вид, не активируя карту или маркеры вышек. Кнопка подключения Яндекс Карт автоматически скрывается после успешной серверной проверки ключа; пока ключ проверяется, отображается статус ожидания, при ошибке предлагается исправить подключение. Управление ключом остаётся в настройках API. Остальные возможности v0.8.0 сохранены: HiDPI Яндекс, кеш разрешённых карт, Google Map Tiles, ручная геопозиция и радарный компас. CI: unit-тесты, Android Lint, сборка APK и проверка v2 подписи. APK подписан временным debug-ключом и может не установиться поверх предыдущего APK. Эта версия prerelease, 1.0.0 stable только после отдельного согласия пользователя." \
              --prerelease
          fi
          echo "Direct APK: https://github.com/$GITHUB_REPOSITORY/releases/download/v0.9.0/TowerRadar-v0.9.0-debug.apk" >> "$GITHUB_STEP_SUMMARY"
